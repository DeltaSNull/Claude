# Publishes the toy phone (the toy-phone/ folder) to GitHub Pages.
# The site is plain HTML, CSS and JavaScript with relative paths, so there is no build: this copies the files
# the page needs into _site and deploys that. Tests, tools and the private family folder are never published.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'claude/new-session-bg4u4c']
    paths: ['toy-phone/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push waits rather than cancelling one that is half done
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Gather the site
        run: |
          mkdir -p _site/assets
          cp toy-phone/index.html toy-phone/manifest.webmanifest toy-phone/sw.js _site/
          cp -R toy-phone/icons _site/icons
          # Real animal recordings, if you commit any. assets/family (voices and photos) is left out on purpose:
          # this site is public, so family contacts only work on a private server (see toy-phone/assets/family/README.md).
          cp -R toy-phone/assets/sounds _site/assets/sounds
          ls -R _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
